<!doctype html>
<html><head><meta charset="utf-8"><title>Mosaic Frame Login Page</title>
<script src="/e2e.js"></script></head>
<body>
<h1>Mosaic Frame Login Page</h1>
<p>The login form below comes from another site (cross-origin frame); Mosaic must not fill it
with this site's passwords.</p>
<iframe id="frame" style="width:600px;height:300px" src=""></iframe>
<script>
  document.getElementById('frame').src = '{{ALT_ORIGIN}}/login.html?frame=1&token=' + encodeURIComponent(E2E.token);
</script>
</body></html>
