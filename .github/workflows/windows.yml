# Mosaic for Windows: build, unit-test and package the app (WinUI 3, self-contained, for
# win-x64 and win-arm64), then try each package for real on its own architecture: x64 on
# windows-latest, ARM64 on windows-11-arm.
#
# Kept cheap: one build job (it cross-publishes ARM64), superseded runs are cancelled, NuGet
# packages are cached, artifacts expire after a week.
name: Windows

on:
  push:
    # win-next is the Windows integration branch; win2/<area> are the feature agents' branches.
    branches: [main, windows, win-next, 'win2/**']
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Windows PowerShell 5.1, not PowerShell 7: the scripts under windows/scripts promise to
    # run on a stock Windows installation, so CI runs them the same way.
    shell: powershell

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  # Unit tests run beside the build, so a failing test does not keep the packages from being
  # smoke-tested (and the other way round).
  test:
    name: Build and unit-test
    # A pull request from one of the branches that are built on push would otherwise be
    # built twice for every commit.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
      || !contains(fromJSON('["main", "windows"]'), github.head_ref)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js (for esbuild, which bundles the content blocker)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/**/*.csproj', 'windows/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build the content blocker
        # uBlock Origin's engine bundled from its pinned, checksum-verified source, and today's
        # snapshot of the filter lists: what the package ships and the engine tests run.
        run: .\windows\scripts\bootstrap.ps1 -BlockerOnly

      - name: Restore
        run: dotnet restore windows/Mosaic.slnx

      - name: Build
        run: dotnet build windows/Mosaic.slnx --configuration Release --no-restore

      - name: Use the runner's Firefox for the Gecko integration tests
        run: |
          $firefox = Join-Path $env:ProgramFiles 'Mozilla Firefox\firefox.exe'
          if (Test-Path -LiteralPath $firefox) {
            "MOSAIC_GECKO_EXE=$firefox" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Gecko integration tests will use $firefox ($((Get-Item -LiteralPath $firefox).VersionInfo.ProductVersion))"
          } else {
            Write-Host "::warning::No Firefox on this runner; the Gecko integration tests will not run."
          }

      - name: Unit tests
        # With the bundle just built, the engine tests run uBlock Origin's real engine, and the
        # Gecko blocker test runs it inside the runner's Firefox too.
        env:
          MOSAIC_UBLOCK_DIR: ${{ github.workspace }}\windows\vendor\ublock
        run: dotnet test windows/tests/Mosaic.Core.Tests --configuration Release --no-build

      - name: Gecko process diagnostics
        # What Firefox's processes do when started the engine's way; read this first when the
        # Gecko integration tests fail on Windows.
        if: always() && env.MOSAIC_GECKO_EXE != ''
        continue-on-error: true
        run: |
          Write-Host '--- headless (as the integration tests run it) ---'
          .\windows\scripts\diagnose-gecko.ps1 -Headless -Seconds 20
          Write-Host ''
          Write-Host '--- with a window (as Mosaic runs it) ---'
          .\windows\scripts\diagnose-gecko.ps1 -Seconds 20

  build:
    name: Publish win-x64 and win-arm64
    # A pull request from one of the branches that are built on push would otherwise be
    # built twice for every commit.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
      || !contains(fromJSON('["main", "windows"]'), github.head_ref)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js (for esbuild, which bundles the content blocker)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/**/*.csproj', 'windows/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build the content blocker
        # uBlock Origin's engine bundled from its pinned, checksum-verified source, and today's
        # snapshot of the filter lists: what the package ships and the engine tests run.
        run: .\windows\scripts\bootstrap.ps1 -BlockerOnly

      - name: Publish win-x64 and win-arm64
        # Self-contained: .NET and the Windows App SDK runtime ship inside each package.
        run: .\windows\scripts\build.ps1 -Runtime win-x64, win-arm64 -Zip -SkipTests

      - name: Upload the x64 package
        uses: actions/upload-artifact@v7
        with:
          name: Mosaic-win-x64
          path: windows/publish/Mosaic-*-win-x64.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0   # it is a zip already

      - name: Upload the ARM64 package
        uses: actions/upload-artifact@v7
        with:
          name: Mosaic-win-arm64
          path: windows/publish/Mosaic-*-win-arm64.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  smoke:
    name: Smoke test (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            runner: windows-latest
          - arch: arm64
            rid: win-arm64
            runner: windows-11-arm
    # This drives UI code that could not be run where it was written. A failure here is
    # information, not a broken build: look at the uploaded screenshots and logs.
    continue-on-error: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Check out
        # The scripts, and the tests the end-to-end step runs against the published app.
        uses: actions/checkout@v7

      - name: Download the package
        uses: actions/download-artifact@v8
        with:
          name: Mosaic-${{ matrix.rid }}
          path: windows/publish

      - name: Unpack
        run: |
          $package = Get-ChildItem -Path windows\publish -Filter 'Mosaic-*-${{ matrix.rid }}.zip' | Select-Object -First 1
          if (-not $package) { throw 'The package was not downloaded.' }
          Expand-Archive -LiteralPath $package.FullName -DestinationPath windows\publish\${{ matrix.rid }} -Force
          Write-Host "Runner: $env:PROCESSOR_ARCHITECTURE, $((Get-CimInstance Win32_OperatingSystem).Caption) $((Get-CimInstance Win32_OperatingSystem).Version)"

      - name: Install the Gecko engine (Firefox ESR)
        # If Mozilla's download is unavailable, smoke.ps1 falls back to the runner's Firefox.
        # The content blocker comes built in the package.
        continue-on-error: true
        run: .\windows\scripts\bootstrap.ps1 -SkipBlocker

      - name: Make sure the WebView2 runtime is installed
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @(
            "Registry::HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client",
            "Registry::HKEY_CURRENT_USER\Software\Microsoft\EdgeUpdate\Clients\$client"
          )
          function Get-WebView2Version {
            foreach ($key in $keys) {
              $entry = Get-ItemProperty -LiteralPath $key -Name pv -ErrorAction SilentlyContinue
              if ($entry -and $entry.pv -and $entry.pv -ne '0.0.0.0') { return $entry.pv }
            }
          }
          $version = Get-WebView2Version
          if (-not $version) {
            Write-Host 'WebView2 runtime not found; installing the Evergreen runtime.'
            $ProgressPreference = 'SilentlyContinue'
            $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup -UseBasicParsing
            $signature = Get-AuthenticodeSignature -LiteralPath $setup
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              throw "The WebView2 bootstrapper is not validly signed by Microsoft ($($signature.Status))."
            }
            $install = Start-Process -FilePath $setup -ArgumentList '/silent', '/install' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "WebView2 setup failed with exit code $($install.ExitCode)." }
            $version = Get-WebView2Version
            if (-not $version) { throw 'WebView2 setup finished but the runtime is still not registered.' }
          }
          Write-Host "WebView2 runtime $version"

      - name: Smoke test
        run: .\windows\scripts\smoke.ps1 -AppPath windows\publish\${{ matrix.rid }}\Mosaic.exe -OutputDirectory windows\artifacts\smoke

      - name: Gecko in an owned window (the fallback hosting mode)
        # Evidence that the fallback works; not a check of its own.
        if: always()
        continue-on-error: true
        run: .\windows\scripts\smoke.ps1 -AppPath windows\publish\${{ matrix.rid }}\Mosaic.exe -OutputDirectory windows\artifacts\smoke\variant-owned -GeckoOnly -GeckoHostMode owned

      - name: Set up .NET 10 (for the end-to-end tests)
        if: always()
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: End-to-end tests against the published app
        # Feature areas' *EndToEnd tests (in Mosaic.Core.Tests) drive the real app named by
        # MOSAIC_APP_EXE; without it they skip. Information while the areas bring them up.
        if: always()
        continue-on-error: true
        env:
          MOSAIC_APP_EXE: ${{ github.workspace }}\windows\publish\${{ matrix.rid }}\Mosaic.exe
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: dotnet test windows/tests/Mosaic.Core.Tests --configuration Release --filter "FullyQualifiedName~EndToEnd" --logger "console;verbosity=normal"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-output-${{ matrix.arch }}
          path: |
            windows/artifacts/smoke
            !windows/artifacts/smoke/**/data/**
          if-no-files-found: warn
          retention-days: 7
